docs_dir: docs

# Legacy redirect stubs and the internal SignPath application stay in the
# repository but are not part of the published site.
exclude_docs: |
  ARCHITECTURE.md
  SECURITY.md
  SIGNPATH_APPLICATION.md

site_name: Plasma
site_description: >-
  A lake-less Windows EDR: on-box sensors, on-device questions, and
  human-gated, reversible response. No log lake, no cloud, no blind trust.
site_url: https://drolu.github.io/plasma/
repo_url: https://github.com/DrOlu/plasma
repo_name: DrOlu/plasma

theme:
  name: material
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - search.suggest
    - search.highlight
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Start:
      - Getting started: getting-started.md
      - Deployment (MSI/GPO): deployment.md
      - Concepts: concepts.md
  - Agent:
      - Agent-native operation: agent-native.md
      - Control plane: control-plane.md
      - State machines: state-machines.md
  - Detect:
      - Sensors: sensors.md
      - Detection: detection.md
      - DTrace tracing: trace.md
  - Operate:
      - Response: response.md
      - Fleet: fleet.md
      - Operations: operations.md
      - Updates & signing: update-signing.md
  - Trust:
      - Compliance evidence: compliance.md
      - Assurance: assurance.md
      - Security model: security-model.md
  - Reference:
      - CLI reference: cli.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/raft.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DrOlu/plasma
