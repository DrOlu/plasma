name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Plasma + neuralOS
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" neuralos==3.10.2

      - name: Fetch Windows and Linux engines
        run: |
          python - <<'PY'
          import os, shutil
          from needle.agent import fetch
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          for platform in ("windows-x86_64", "linux-x86_64"):
              fetch.download_platform(platform, "engines", generation=3)
              shutil.copy(weights, f"engines/{platform}/needle3.cact")
          os.chmod("engines/linux-x86_64/needle", 0o755)
          print(sorted(os.listdir("engines/windows-x86_64")))
          PY

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + verify bundle
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          plasma bundle build --out dist --version "$VERSION" --engines engines
          plasma manifest verify --dir "dist/plasma-$VERSION"
          (cd dist && sha256sum "plasma-$VERSION.zip" > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/plasma-$VERSION.zip" "dist/SHA256SUMS" --clobber
          else
            gh release create "$TAG" "dist/plasma-$VERSION.zip" "dist/SHA256SUMS" \
              --title "Plasma $VERSION" --generate-notes
          fi
