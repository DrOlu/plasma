name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.3.0)"
        required: true
        default: "0.3.0"

permissions:
  contents: write

env:
  SENTINEL_SETUP: "SentinelSetup-3.3.1.exe"
  SENTINEL_BASE: "https://github.com/psihijatrija/Sentinel/releases/download/v3.3.1"

jobs:
  windows-x64:
    name: build + publish Windows x64 single exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]" neuralos==3.10.2

      - name: Fetch Windows engine + weights
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          from needle.agent import fetch
          fetch.download_platform("windows-x86_64", "engines", generation=3)
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/windows-x86_64/needle3.cact")
          PY

      - name: Fetch Sentinel payload (MIT, checksum-verified)
        shell: bash
        run: |
          mkdir -p sensors/sentinel
          curl -fsSL -o "sensors/sentinel/${SENTINEL_SETUP}" "${SENTINEL_BASE}/${SENTINEL_SETUP}"
          curl -fsSL -o sensors/sentinel/SHA256SUMS.txt "${SENTINEL_BASE}/SHA256SUMS.txt"
          curl -fsSL -o sensors/sentinel/LICENSE \
            "https://raw.githubusercontent.com/psihijatrija/Sentinel/v3.3.1/LICENSE"
          cd sensors/sentinel
          sha256sum -c <(grep "${SENTINEL_SETUP}" SHA256SUMS.txt)

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build embedded executable
        run: |
          python tools/build_embedded_windows.py --engine-dir engines/windows-x86_64 `
            --sentinel-payload sensors/sentinel --dist dist --name plasma

      - name: Rename, hash and smoke test
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          mv dist/plasma.exe "dist/plasma-$VERSION-windows-x64.exe"
          (cd dist && sha256sum "plasma-$VERSION-windows-x64.exe" > SHA256SUMS)
          ./dist/plasma-$VERSION-windows-x64.exe --version
          ./dist/plasma-$VERSION-windows-x64.exe status --events samples/plasma_events.jsonl
          ./dist/plasma-$VERSION-windows-x64.exe ask --prompt "critical alerts" --events samples/plasma_events.jsonl

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/plasma-$VERSION-windows-x64.exe" dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              "dist/plasma-$VERSION-windows-x64.exe" dist/SHA256SUMS \
              --title "Plasma $VERSION (Windows x64)" --generate-notes
          fi
