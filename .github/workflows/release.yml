name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.0)"
        required: true
        default: "0.5.0"

permissions:
  contents: write

env:
  WHIDS_BUNDLE: "https://github.com/0xrawsec/whids/releases/download/v1.7.0/whids-v1.7.0-release-bundle.zip"

jobs:
  windows-x64:
    name: build + publish Windows x64 single exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]" neuralos==3.10.2

      - name: Fetch Windows engine + weights
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          from needle.agent import fetch
          fetch.download_platform("windows-x86_64", "engines", generation=3)
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/windows-x86_64/needle3.cact")
          PY

      - name: Fetch WHIDS payload (AGPL-3.0)
        shell: bash
        run: |
          mkdir -p sensors/whids
          curl -fsSL -A "plasma-deploy" -o whids-bundle.zip "$WHIDS_BUNDLE"
          unzip -o -q whids-bundle.zip -d whids-bundle
          find whids-bundle -name "whids.exe" -exec cp {} sensors/whids/whids.exe \;

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build embedded executable
        run: |
          python tools/build_embedded_windows.py --engine-dir engines/windows-x86_64 `
            --whids-payload sensors/whids --dist dist --name plasma

      - name: Rename, hash and smoke test
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          mv dist/plasma.exe "dist/plasma-$VERSION-windows-x64.exe"
          (cd dist && sha256sum "plasma-$VERSION-windows-x64.exe" > SHA256SUMS)
          ./dist/plasma-$VERSION-windows-x64.exe --version
          ./dist/plasma-$VERSION-windows-x64.exe status --events samples/plasma_events.jsonl
          ./dist/plasma-$VERSION-windows-x64.exe ask --prompt "critical alerts" --events samples/plasma_events.jsonl

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/plasma-$VERSION-windows-x64.exe" dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              "dist/plasma-$VERSION-windows-x64.exe" dist/SHA256SUMS \
              --title "Plasma $VERSION (Windows x64)" --generate-notes
          fi
