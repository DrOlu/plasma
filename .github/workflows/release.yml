name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  WHIDS_BUNDLE: "https://github.com/0xrawsec/whids/releases/download/v1.7.0/whids-v1.7.0-release-bundle.zip"

jobs:
  windows-x64:
    name: build + publish Windows x64 single exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]" neuralos==3.10.2

      - name: Fetch Windows engine + weights (pinned revision)
        shell: bash
        run: |
          # upstream removed the per-platform bundles on 2026-11-05; the
          # pinned revision is the last one carrying them (weights identical)
          python tools/fetch_engine.py --platform windows-x86_64 --dest engines/windows-x86_64
          python - <<'PY'
          import os, shutil
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/windows-x86_64/needle3.cact")
          print(os.listdir("engines/windows-x86_64"))
          PY

      - name: Fetch WHIDS payload (Apache-2.0)
        shell: bash
        run: |
          mkdir -p sensors/whids
          curl -fsSL -A "plasma-deploy" -o whids-bundle.zip "$WHIDS_BUNDLE"
          unzip -o -q whids-bundle.zip -d whids-bundle
          find whids-bundle -path "*whids/windows/whids-v*-amd64.exe" -exec cp {} sensors/whids/whids.exe \;
          test -s sensors/whids/whids.exe || { echo "FATAL: whids agent binary not found in bundle" >&2; ls -R whids-bundle >&2; exit 1; }

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Clone krabsetw + compile plasma-tap into the payload
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/krabsetw krabsetw-src
          mkdir sensors\tap
          cl /nologo /std:c++17 /EHsc /O2 /W3 /DUNICODE /D_UNICODE /I krabsetw-src\krabs tap\plasma-tap.cpp /Fe:sensors\tap\plasma-tap.exe tdh.lib advapi32.lib
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build embedded executable
        run: |
          python tools/build_embedded_windows.py --engine-dir engines/windows-x86_64 `
            --whids-payload sensors/whids --tap-payload sensors/tap --dist dist --name plasma

      - name: Rename, sign (optional), hash and smoke test
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $exe = "dist/plasma-$version-windows-x64.exe"
          Move-Item dist/plasma.exe $exe -Force

          # Authenticode signing when the PFX secrets exist (see
          # docs/SIGNPATH_APPLICATION.md for the SignPath route). Signing must
          # happen BEFORE SHA256SUMS so the published hash covers the signed file.
          if ($env:SIGNING_PFX_BASE64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $st = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if (-not $st) {
              $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
            }
            if (-not $st) { throw "signtool.exe not found on runner" }
            $signtool = if ($st.Source) { $st.Source } else { $st.FullName }
            & $signtool sign /f $pfxPath /p $env:SIGNING_PFX_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool signing failed" }
            # The project cert is self-signed: trust it in THIS ephemeral
            # runner only, so /pa verification exercises the real chain
            # instead of failing on an untrusted root.
            $secure = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfxPath -Password $secure `
              -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            Import-PfxCertificate -FilePath $pfxPath -Password $secure `
              -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
            & $signtool verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed" }
            Write-Host "Signed and verified: $exe"
          } else {
            Write-Host "No signing secrets configured - publishing unsigned build"
          }

          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  " +
            (Split-Path $exe -Leaf) | Set-Content dist/SHA256SUMS -Encoding ASCII
          & $exe --version
          & $exe status --events samples/plasma_events.jsonl
          & $exe ask --prompt "critical alerts" --events samples/plasma_events.jsonl
          & $exe tap selftest

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/plasma-$VERSION-windows-x64.exe" dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              "dist/plasma-$VERSION-windows-x64.exe" dist/SHA256SUMS \
              --title "Plasma $VERSION (Windows x64)" --generate-notes
          fi
