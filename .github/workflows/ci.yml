name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WHIDS_VERSION: "1.7.0"
  WHIDS_BUNDLE: "https://github.com/0xrawsec/whids/releases/download/v1.7.0/whids-v1.7.0-release-bundle.zip"

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + bridge + packaging tests
        run: pytest -q

  selection:
    name: engine selection (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Plasma + neuralOS
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" neuralos==3.10.2
      - name: Fetch standalone engine and weights (pinned revision)
        run: |
          python tools/fetch_engine.py --platform linux-x86_64 --dest engines/linux-x86_64
          python - <<'PY'
          import os, shutil
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/linux-x86_64/needle3.cact")
          os.chmod("engines/linux-x86_64/needle", 0o755)
          PY
      - name: Selection matrix
        env:
          PLASMA_ENGINE: ${{ github.workspace }}/engines/linux-x86_64/needle
          PLASMA_MODEL: ${{ github.workspace }}/engines/linux-x86_64/needle3.cact
        run: pytest -q tests/test_selection.py

  tap:
    name: compile + selftest ETW tap (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Plasma (rules builder)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Clone krabsetw (SHA recorded in summary)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/krabsetw krabsetw-src
          echo "KRABS_SHA=$(git -C krabsetw-src rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile plasma-tap.exe
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /O2 /W3 /DUNICODE /D_UNICODE /I krabsetw-src\krabs tap\plasma-tap.cpp /Fe:plasma-tap.exe tdh.lib advapi32.lib
      - name: Render rules + selftest (no trace needed)
        shell: bash
        run: |
          mkdir -p build
          python -c "from plasma.tap import load_rules, build_rules_txt; build_rules_txt(load_rules('sensors/plasma-tap-rules.json'), 'build/plasma-tap-rules.txt')"
          ./plasma-tap.exe --rules build/plasma-tap-rules.txt --selftest
      - name: "Live capture window (best-effort: hosted runners may deny ETW)"
        shell: bash
        run: |
          set +e
          ./plasma-tap.exe --rules build/plasma-tap-rules.txt --out "$RUNNER_TEMP/tap-matches.jsonl" --providers dns --for 2 --max-matches 10
          rc=$?
          if [ $rc -eq 3 ]; then
            echo "CI runner cannot host an ETW session (exit 3) — live window validated on endpoints instead"
            exit 0
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-tap-windows
          path: plasma-tap.exe
          if-no-files-found: error

  windows-embedded:
    name: build + smoke test Windows x64 single exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]" neuralos==3.10.2
      - name: Fetch Windows engine + weights (pinned revision)
        shell: bash
        run: |
          # upstream removed the per-platform bundles on 2026-11-05; the
          # pinned revision is the last one carrying them (weights identical)
          python tools/fetch_engine.py --platform windows-x86_64 --dest engines/windows-x86_64
          python - <<'PY'
          import os, shutil
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/windows-x86_64/needle3.cact")
          print(os.listdir("engines/windows-x86_64"))
          PY
          print(os.listdir("engines/windows-x86_64"))
          PY
      - name: Fetch WHIDS payload
        shell: bash
        run: |
          mkdir -p sensors/whids
          curl -fsSL -A "plasma-deploy" -o whids-bundle.zip "$WHIDS_BUNDLE"
          unzip -o -q whids-bundle.zip -d whids-bundle
          find whids-bundle -path "*whids/windows/whids-v*-amd64.exe" -exec cp {} sensors/whids/whids.exe \;
          test -s sensors/whids/whids.exe || { echo "FATAL: whids agent binary not found in bundle" >&2; ls -R whids-bundle >&2; exit 1; }
          ls -la sensors/whids
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Clone krabsetw + compile plasma-tap into the payload
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/krabsetw krabsetw-src
          mkdir sensors\tap
          cl /nologo /std:c++17 /EHsc /O2 /W3 /DUNICODE /D_UNICODE /I krabsetw-src\krabs tap\plasma-tap.cpp /Fe:sensors\tap\plasma-tap.exe tdh.lib advapi32.lib
      - name: Build single self-contained exe
        run: python tools/build_embedded_windows.py --engine-dir engines/windows-x86_64 --whids-payload sensors/whids --tap-payload sensors/tap --dist dist --name plasma
      - name: Smoke test the embedded executable
        shell: bash
        run: |
          ./dist/plasma.exe --version
          ./dist/plasma.exe status --events samples/plasma_events.jsonl
          ./dist/plasma.exe probe --tool plasma_overview --events samples/plasma_events.jsonl
          ./dist/plasma.exe ask --prompt "critical alerts" --events samples/plasma_events.jsonl
          ./dist/plasma.exe install --dry-run --root "$RUNNER_TEMP/plasma-install" --skip-sysmon-check
          ./dist/plasma.exe tap list
          ./dist/plasma.exe tap selftest
      - name: WHIDS integration smoke (pull -> push -> status)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/whids/Logs/Alerts/2026-10-19"
          cp tests/fixtures/whids_alerts.jsonl "$RUNNER_TEMP/whids/Logs/Alerts/2026-10-19/alerts.jsonl"
          ./dist/plasma.exe whids pull --root "$RUNNER_TEMP/whids" --out "$RUNNER_TEMP/plasma-events.jsonl"
          ./dist/plasma.exe whids push --root "$RUNNER_TEMP/whids" --events "$RUNNER_TEMP/plasma-events.jsonl" --min-confidence 8
          ./dist/plasma.exe whids push --root "$RUNNER_TEMP/whids" --events "$RUNNER_TEMP/plasma-events.jsonl" --min-confidence 8 --apply --reason "ci smoke"
          ./dist/plasma.exe whids status --root "$RUNNER_TEMP/whids" --events "$RUNNER_TEMP/plasma-events.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-windows-x64
          path: dist/plasma.exe
          if-no-files-found: error
