name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SENTINEL_VERSION: "3.3.1"
  SENTINEL_SETUP: "SentinelSetup-3.3.1.exe"
  SENTINEL_BASE: "https://github.com/psihijatrija/Sentinel/releases/download/v3.3.1"

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch Sentinel payload (Windows, py3.12)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: bash
        run: |
          mkdir -p sensors/sentinel
          curl -fsSL -o "sensors/sentinel/${SENTINEL_SETUP}" "${SENTINEL_BASE}/${SENTINEL_SETUP}"
          curl -fsSL -o sensors/sentinel/SHA256SUMS.txt "${SENTINEL_BASE}/SHA256SUMS.txt"
          curl -fsSL -o sensors/sentinel/LICENSE \
            "https://raw.githubusercontent.com/psihijatrija/Sentinel/v3.3.1/LICENSE"
      - name: Unit + bridge + packaging tests
        run: pytest -q

  selection:
    name: engine selection (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Plasma + neuralOS
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" neuralos==3.10.2
      - name: Fetch standalone engine and weights
        run: |
          python - <<'PY'
          import os, shutil
          from needle.agent import fetch
          fetch.download_platform("linux-x86_64", "engines", generation=3)
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/linux-x86_64/needle3.cact")
          os.chmod("engines/linux-x86_64/needle", 0o755)
          PY
      - name: Selection matrix
        env:
          PLASMA_ENGINE: ${{ github.workspace }}/engines/linux-x86_64/needle
          PLASMA_MODEL: ${{ github.workspace }}/engines/linux-x86_64/needle3.cact
        run: pytest -q tests/test_selection.py

  binary:
    name: plasma binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Build one-file executable
        shell: bash
        run: |
          pyinstaller --onefile --name plasma \
            --collect-all pydantic --collect-all pydantic_core \
            plasma_entry.py
      - name: Rename + smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/plasma.exe dist/plasma-windows-x86_64.exe
            ./dist/plasma-windows-x86_64.exe --version
          else
            mv dist/plasma dist/plasma-linux-x86_64
            ./dist/plasma-linux-x86_64 --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-${{ runner.os }}
          path: |
            dist/plasma-linux-x86_64
            dist/plasma-windows-x86_64.exe
          if-no-files-found: error

  package:
    name: build + verify bundle
    runs-on: ubuntu-latest
    needs: [test, binary]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Plasma
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download Plasma binaries
        uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: plasma-*
          merge-multiple: true
      - name: Fetch bundled Sentinel payload
        run: |
          mkdir -p sensors/sentinel
          curl -fsSL -o "sensors/sentinel/${SENTINEL_SETUP}" "${SENTINEL_BASE}/${SENTINEL_SETUP}"
          curl -fsSL -o sensors/sentinel/SHA256SUMS.txt "${SENTINEL_BASE}/SHA256SUMS.txt"
          curl -fsSL -o sensors/sentinel/LICENSE \
            "https://raw.githubusercontent.com/psihijatrija/Sentinel/v3.3.1/LICENSE"
          cd sensors/sentinel
          sha256sum -c <(grep "${SENTINEL_SETUP}" SHA256SUMS.txt)
      - name: Build bundle with Sentinel + binaries
        run: |
          chmod +x bin/plasma-linux-x86_64
          plasma bundle build --out dist --version 0.1.0 \
            --sentinel-payload sensors/sentinel \
            --binary bin/plasma-linux-x86_64 \
            --binary bin/plasma-windows-x86_64.exe
      - name: Verify manifest
        run: plasma manifest verify --dir dist/plasma-0.1.0
      - name: Frozen binary executes the bundle bridge
        run: |
          ./bin/plasma-linux-x86_64 status \
            --bundle dist/plasma-0.1.0 --events samples/plasma_events.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-bundle
          path: |
            dist/plasma-0.1.0.zip
            bin/plasma-linux-x86_64
            bin/plasma-windows-x86_64.exe
          if-no-files-found: error
