name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + bridge + packaging tests
        run: pytest -q

  selection:
    name: engine selection (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Plasma + neuralOS
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" neuralos==3.10.2
      - name: Fetch standalone engine and weights
        run: |
          python - <<'PY'
          import os, shutil
          from needle.agent import fetch
          fetch.download_platform("linux-x86_64", "engines", generation=3)
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/linux-x86_64/needle3.cact")
          os.chmod("engines/linux-x86_64/needle", 0o755)
          print("engine:", os.listdir("engines/linux-x86_64"))
          PY
      - name: Selection matrix
        env:
          PLASMA_ENGINE: ${{ github.workspace }}/engines/linux-x86_64/needle
          PLASMA_MODEL: ${{ github.workspace }}/engines/linux-x86_64/needle3.cact
        run: pytest -q tests/test_selection.py

  package:
    name: build + verify bundle
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build bundle
        run: plasma bundle build --out dist --version 0.1.0
      - name: Verify manifest
        run: plasma manifest verify --dir dist/plasma-0.1.0
      - name: Status report
        run: plasma status --bundle dist/plasma-0.1.0 --events samples/plasma_events.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-bundle
          path: dist/plasma-0.1.0.zip
          if-no-files-found: error
