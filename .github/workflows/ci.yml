name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SENTINEL_SETUP: "SentinelSetup-3.3.1.exe"
  SENTINEL_BASE: "https://github.com/psihijatrija/Sentinel/releases/download/v3.3.1"

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch Sentinel payload (Windows, py3.12)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: bash
        run: |
          mkdir -p sensors/sentinel
          curl -fsSL -o "sensors/sentinel/${SENTINEL_SETUP}" "${SENTINEL_BASE}/${SENTINEL_SETUP}"
          curl -fsSL -o sensors/sentinel/SHA256SUMS.txt "${SENTINEL_BASE}/SHA256SUMS.txt"
          curl -fsSL -o sensors/sentinel/LICENSE \
            "https://raw.githubusercontent.com/psihijatrija/Sentinel/v3.3.1/LICENSE"
      - name: Unit + bridge + packaging tests
        run: pytest -q

  selection:
    name: engine selection (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Plasma + neuralOS
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" neuralos==3.10.2
      - name: Fetch standalone engine and weights
        run: |
          python - <<'PY'
          import os, shutil
          from needle.agent import fetch
          fetch.download_platform("linux-x86_64", "engines", generation=3)
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/linux-x86_64/needle3.cact")
          os.chmod("engines/linux-x86_64/needle", 0o755)
          PY
      - name: Selection matrix
        env:
          PLASMA_ENGINE: ${{ github.workspace }}/engines/linux-x86_64/needle
          PLASMA_MODEL: ${{ github.workspace }}/engines/linux-x86_64/needle3.cact
        run: pytest -q tests/test_selection.py

  windows-embedded:
    name: build + smoke test Windows x64 single exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]" neuralos==3.10.2
      - name: Fetch Windows engine + weights
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          from needle.agent import fetch
          fetch.download_platform("windows-x86_64", "engines", generation=3)
          import needle
          weights = os.path.join(os.path.dirname(needle.__file__), "needle3.cact")
          shutil.copy(weights, "engines/windows-x86_64/needle3.cact")
          print(os.listdir("engines/windows-x86_64"))
          PY
      - name: Fetch Sentinel payload
        shell: bash
        run: |
          mkdir -p sensors/sentinel
          curl -fsSL -o "sensors/sentinel/${SENTINEL_SETUP}" "${SENTINEL_BASE}/${SENTINEL_SETUP}"
          curl -fsSL -o sensors/sentinel/SHA256SUMS.txt "${SENTINEL_BASE}/SHA256SUMS.txt"
          curl -fsSL -o sensors/sentinel/LICENSE \
            "https://raw.githubusercontent.com/psihijatrija/Sentinel/v3.3.1/LICENSE"
          cd sensors/sentinel
          sha256sum -c <(grep "${SENTINEL_SETUP}" SHA256SUMS.txt)
      - name: Build single self-contained exe
        run: python tools/build_embedded_windows.py --engine-dir engines/windows-x86_64 --sentinel-payload sensors/sentinel --dist dist --name plasma
      - name: Smoke test the embedded executable
        shell: bash
        run: |
          ./dist/plasma.exe --version
          ./dist/plasma.exe status --events samples/plasma_events.jsonl
          ./dist/plasma.exe probe --tool plasma_overview --events samples/plasma_events.jsonl
          ./dist/plasma.exe ask --prompt "critical alerts" --events samples/plasma_events.jsonl
          ./dist/plasma.exe install --dry-run --root "$RUNNER_TEMP/plasma-install"
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-windows-x64
          path: dist/plasma.exe
          if-no-files-found: error
